<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Open book logo</title>
  <desc>Warm coral rounded-square icon with a cream open book.</desc>

  <defs>
    <linearGradient id="background" x1="64" y1="0" x2="64" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6850"/>
      <stop offset="1" stop-color="#E54D31"/>
    </linearGradient>
    <linearGradient id="paper" x1="64" y1="26" x2="64" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFBEF"/>
      <stop offset="1" stop-color="#FFF1D6"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="url(#background)"/>

  <!-- Book cover visible behind the pages. -->
  <path d="M19 40.5V87.5H41.5C50.5 87.5 56.5 89.8 61.5 94C63 95.2 65 95.2 66.5 94C71.5 89.8 77.5 87.5 86.5 87.5H105V40.5"
        stroke="#FFF1D3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Open pages. -->
  <path d="M24 27.5C37.2 27 49.8 30.2 61.8 36.5V88C51.5 80.8 38.7 77.2 24 77.6V27.5Z" fill="url(#paper)"/>
  <path d="M64.2 36.5C76.2 30.2 88.8 27 100 27.5V77.6C85.3 77.2 72.5 80.8 64.2 88V36.5Z" fill="url(#paper)"/>
  <path d="M63 36.8V88" stroke="#F15A3D" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Reading lines. -->
  <g stroke="#F35F43" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M32.5 38C40.3 38.2 47.7 40 53.6 43.3"/>
    <path d="M32.5 46.9C40.5 47.2 47.6 49.1 53.6 52.2"/>
    <path d="M32.5 55.8C40.5 56.1 47.7 58 53.6 61.1"/>
    <path d="M32.5 64.7C40.3 65 47.6 66.7 53.6 69.7"/>

    <path d="M70.4 43.3C76.3 40 83.7 38.2 91.5 38"/>
    <path d="M70.4 52.2C76.4 49.1 83.5 47.2 91.5 46.9"/>
    <path d="M70.4 61.1C76.3 58 83.5 56.1 91.5 55.8"/>
    <path d="M70.4 69.7C76.4 66.7 83.7 65 91.5 64.7"/>
  </g>
</svg>
