name: CHM compatibility report
description: Report a CHM file that opens, renders, navigates, searches, or encodes differently than expected.
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CHMReaderLight compatibility. Before filing, check the compatibility notes:
        https://github.com/zhongdiandaoda/chm-reader-light/blob/main/docs/compatibility.md
        Search existing Issues and Discussions before filing:
        - https://github.com/zhongdiandaoda/chm-reader-light/issues?q=is%3Aissue
        - https://github.com/zhongdiandaoda/chm-reader-light/discussions
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe how this CHM behaves differently than expected.
      placeholder: "Example: The table of contents is empty, but the same file shows nested topics in another reader."
    validations:
      required: true
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - Opening
        - Table of contents
        - Page rendering
        - Internal links
        - Text encoding
        - Search indexing
        - Images, styles, fonts, or media
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest steps that reproduce the compatibility problem.
      placeholder: |
        1. Open CHMReaderLight
        2. Add the CHM file
        3. Open topic ...
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: How did you install or run CHMReaderLight?
      options:
        - GitHub release zip
        - Built locally with npm run package:mac
        - Running from source with npm run run
        - Not sure
    validations:
      required: true
  - type: textarea
    id: chm-details
    attributes:
      label: CHM details
      description: Share safe details that help reproduce the issue without exposing private content.
      placeholder: "Example: Simplified Chinese, 38 MB, generated by an older SDK documentation tool."
    validations:
      required: true
  - type: dropdown
    id: shareable
    attributes:
      label: Can this CHM be shared?
      options:
        - Public sample attached or linked
        - Can share privately with maintainers
        - Cannot share the file
        - Not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic info
      description: In the app, choose Help > Copy Diagnostic Info and paste the result here.
      render: shell
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs
      description: Add screenshots, copied error text, or logs with private paths and document content removed.
