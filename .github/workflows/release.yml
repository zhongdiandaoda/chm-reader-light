name: Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after the Apple Silicon build passes
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag in vMAJOR.MINOR.PATCH format; required when publishing
        required: false
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate_release:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Checkout tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release tag
        id: release_tag
        shell: bash
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$PUBLISH_RELEASE" != "true" ]]; then
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            release_tag="$MANUAL_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH; received: $release_tag" >&2
            exit 1
          fi

          package_version=$(node -p "require('./package.json').version")
          if [[ "$release_tag" != "v$package_version" ]]; then
            echo "Release tag $release_tag does not match package version v$package_version." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "$release_tag")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $release_tag does not point to selected commit $GITHUB_SHA." >&2
              exit 1
            fi
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS arm64
    needs: validate_release
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package release artifact
        run: npm run package:release:mac:arm64

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CHMReaderLight-mac-arm64
          path: |
            CHMReaderLight-mac-arm64.zip
            CHMReaderLight-mac-arm64.zip.sha256
          if-no-files-found: error

  attest:
    name: Attest release artifacts
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Download macOS release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: CHMReaderLight-mac-*
          path: dist/attest
          merge-multiple: true

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/attest/CHMReaderLight-mac-arm64.zip
            dist/attest/CHMReaderLight-mac-arm64.zip.sha256

  prepare_publish:
    name: Prepare GitHub Release publication
    needs: [validate_release, macos, attest]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.publish_input.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Download macOS release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: CHMReaderLight-mac-*
          path: dist/release
          merge-multiple: true

      - name: Verify complete release artifact set
        run: node scripts/check-release-artifacts.js dist/release

      - name: Upload minimal release publication input
        id: publish_input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-publish-input
          path: |
            package.json
            docs/release-template.md
            scripts/check-release-artifacts.js
            scripts/publish-release.js
            dist/release/CHMReaderLight-mac-arm64.zip
            dist/release/CHMReaderLight-mac-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [validate_release, prepare_publish]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Download prepared release publication input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare_publish.outputs.artifact_id }}
          path: dist/publish

      - name: Publish complete GitHub Release atomically
        working-directory: dist/publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate_release.outputs.release_tag }}
        run: node scripts/publish-release.js --release-dir dist/release --tag "$RELEASE_TAG" --target-commitish "$GITHUB_SHA" --confirm

  verify_published:
    name: Verify published GitHub Release
    needs: [validate_release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Download macOS release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: CHMReaderLight-mac-*
          path: dist/release
          merge-multiple: true

      - name: Verify complete release artifact set
        run: node scripts/check-release-artifacts.js dist/release

      - name: Verify published GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate_release.outputs.release_tag }}
        run: node scripts/check-live-release.js --tag "$RELEASE_TAG" --target-commitish "$GITHUB_SHA" --release-dir dist/release
