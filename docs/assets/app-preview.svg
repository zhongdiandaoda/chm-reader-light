<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">CHMReaderLight macOS app preview</title>
  <desc id="desc">A macOS CHM reader with a library sidebar, searchable book grid, and document reading view.</desc>
  <defs>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e7edf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="70" y="58" width="1140" height="644" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1280" height="760" fill="#eef3f8"/>
  <rect x="70" y="58" width="1140" height="644" rx="24" fill="url(#window)" filter="url(#shadow)"/>
  <g clip-path="url(#windowClip)">
    <rect x="70" y="58" width="1140" height="58" fill="#f8fafc"/>
    <circle cx="104" cy="87" r="8" fill="#ef6a5f"/>
    <circle cx="130" cy="87" r="8" fill="#f3bf4f"/>
    <circle cx="156" cy="87" r="8" fill="#61c454"/>
    <text x="640" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#475569">CHMReaderLight</text>

    <rect x="70" y="116" width="236" height="586" fill="#f1f5f9"/>
    <text x="102" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#0f172a">书库</text>
    <rect x="102" y="190" width="172" height="36" rx="10" fill="#dbeafe"/>
    <text x="122" y="214" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1d4ed8">全部文档</text>
    <text x="102" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#64748b">COLLECTIONS</text>
    <text x="122" y="306" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#334155">技术手册</text>
    <text x="122" y="342" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#334155">离线文档</text>
    <text x="122" y="378" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#334155">API 参考</text>
    <rect x="102" y="614" width="172" height="42" rx="11" fill="#0f172a"/>
    <text x="188" y="641" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">添加 CHM</text>

    <rect x="306" y="116" width="904" height="586" fill="#ffffff"/>
    <text x="346" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="760" fill="#111827">轻量、专注的 macOS CHM 阅读器</text>
    <text x="346" y="198" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#64748b">管理离线 CHM 文档，快速搜索书库和目录，安全阅读本地内容。</text>
    <rect x="346" y="232" width="504" height="42" rx="12" fill="#f8fafc" stroke="#dbe3ec"/>
    <text x="370" y="258" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#64748b">搜索书名、路径或资料分组</text>
    <rect x="874" y="232" width="132" height="42" rx="12" fill="#0f172a"/>
    <text x="940" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">拖拽导入</text>
    <rect x="1020" y="232" width="118" height="42" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1079" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Finder</text>

    <g>
      <rect x="346" y="316" width="238" height="142" rx="14" fill="#f8fafc" stroke="#dbe3ec"/>
      <text x="370" y="354" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Python 3.12 Docs.chm</text>
      <text x="370" y="382" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#64748b">~/Documents/Manuals</text>
      <rect x="370" y="414" width="74" height="24" rx="12" fill="#dcfce7"/>
      <text x="407" y="431" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">技术手册</text>
      <circle cx="544" cy="340" r="16" fill="#e2e8f0"/>
      <text x="544" y="346" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#475569">⌕</text>
    </g>
    <g>
      <rect x="616" y="316" width="238" height="142" rx="14" fill="#f8fafc" stroke="#dbe3ec"/>
      <text x="640" y="354" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Win32 API Reference.chm</text>
      <text x="640" y="382" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#64748b">~/Library/Docs</text>
      <rect x="640" y="414" width="64" height="24" rx="12" fill="#fee2e2"/>
      <text x="672" y="431" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">API</text>
    </g>
    <g>
      <rect x="886" y="316" width="238" height="142" rx="14" fill="#f8fafc" stroke="#dbe3ec"/>
      <text x="910" y="354" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Qt Assistant.chm</text>
      <text x="910" y="382" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#64748b">~/Downloads</text>
      <rect x="910" y="414" width="86" height="24" rx="12" fill="#e0f2fe"/>
      <text x="953" y="431" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#075985">离线文档</text>
    </g>

    <rect x="346" y="500" width="778" height="132" rx="16" fill="#f8fafc" stroke="#dbe3ec"/>
    <rect x="374" y="528" width="198" height="76" rx="10" fill="#ffffff" stroke="#dbe3ec"/>
    <text x="398" y="556" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#111827">目录树</text>
    <line x1="398" y1="578" x2="534" y2="578" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="418" y1="596" x2="520" y2="596" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    <rect x="604" y="528" width="492" height="76" rx="10" fill="#ffffff" stroke="#dbe3ec"/>
    <text x="628" y="556" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#111827">阅读视图</text>
    <line x1="628" y1="578" x2="1050" y2="578" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="628" y1="596" x2="1012" y2="596" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
